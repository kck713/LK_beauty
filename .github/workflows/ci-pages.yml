# CI: 모든 푸시에서 빌드·QA 검사.
# GitHub Pages 테스트 배포: ccr-260d5634-lnlk2f / main 푸시 시 공개 빌드(샘플 데이터 없음)를
# https://<owner>.github.io/<repo>/ 에 올립니다 (상대 경로 빌드).
# 최초 1회: 저장소 Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로 선택해야 합니다 (기본 토큰으로는 자동 활성화 불가).
# 끄려면 저장소 Variables 에 DEPLOY_PAGES = false 를 추가하세요. 실제 서비스 도메인 배포는 docs/DEPLOY.md 참고 (RELATIVE 없이 빌드).
name: ci-and-pages

on:
  push:
    branches: [ccr-260d5634-lnlk2f, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: FIXTURES=1 node src/build.js && FIXTURES=1 node scripts/qa.js

  pages:
    needs: test
    if: github.event_name != 'pull_request' && vars.DEPLOY_PAGES != 'false'
    # Pages 가 아직 켜지지 않은 동안에는 실패해도 CI 전체를 빨갛게 만들지 않음
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build (public content only, relative paths for the /<repo>/ sub-path)
        run: |
          SITE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" \
          RELATIVE=1 node src/build.js
          rm -rf dist/admin
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
